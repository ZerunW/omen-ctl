name: Feature request
description: Suggest an improvement or report test results from another BIOS version.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why the current behaviour does not cover it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: |
        What you would like omenctl to do. If it needs a new firmware command or value,
        say where it comes from (OMEN Gaming Hub, a BIOS method) and whether you can test it.
  - type: input
    id: board
    attributes:
      label: Board and BIOS (if hardware related)
      placeholder: "cat /sys/class/dmi/id/board_name /sys/class/dmi/id/bios_version"
