name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for the desktop app
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev
      - name: Test
        working-directory: app
        run: cargo test --locked
      - name: Build package
        run: packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: omenctl-deb
          path: packaging/out/*.deb
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$v\"" app/Cargo.toml || { echo "tag $GITHUB_REF_NAME does not match app/Cargo.toml"; exit 1; }
          notes=$(awk -v v="$v" '$0 ~ "^## "v" " {f=1; next} /^## / {f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" packaging/out/*.deb --title "omenctl $GITHUB_REF_NAME" --notes "$notes"
