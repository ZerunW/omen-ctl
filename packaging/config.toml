# omenctl configuration (/etc/omenctl/config.toml)
# Every setting has a safe default; deleting a line means "use the default".
# Apply changes with: sudo systemctl restart omenctld
# If this file is invalid the service refuses to start (see journalctl -u omenctld)
# and the machine stays in its safe state.

# Mode used on the very first start (before any mode was saved):
# power_saver, balanced or unleashed
default_mode = "balanced"

# In Unleashed mode, set the CPU+GPU concurrent power target to 75 W
# (this raises the GPU power limit to 115 W)
unleashed_concurrent_75w = true

[modes]
# These three are also set from the desktop app ("Default modes").
# Values: keep, power_saver, balanced, unleashed
# Mode when the service starts (boot). keep = the rule for the current power
# source below if there is one, otherwise the mode used last time.
startup = "keep"
# Switch mode when the adapter is plugged in / when running on battery.
# keep = do not switch.
on_ac = "keep"
on_battery = "keep"
# Switch mode once when the battery falls to low_battery_percent (5-50) while
# unplugged; acts again after plugging in or recharging 5% above it.
on_low_battery = "keep"
low_battery_percent = 20

[rapl]
# Optional: also write intel_rapl PL1/PL2 per mode, in watts
# (0 < PL1 <= PL2 <= 130). Not set = RAPL is left alone. Example:
# balanced = [35, 45]

[fan]
# The curves use the average of the hotter of CPU and GPU over average_s
# seconds (1-30), so one-second load spikes don't move the fans.
# Rising speeds are followed at once; after the last rise the speed is kept
# for hold_s seconds (0-120), then lowered by at most fall_per_s levels
# (1 level = 100 rpm) per second (0.1-5).
# Overheat protection (fans_max_at below) always uses the current reading.
average_s = 5
hold_s = 15
fall_per_s = 0.5
# Top level of the BIOS fan table (52 = 5200 rpm on 8D3F). Do not change.
table_max = 52
# Without [fan.cpu_curve] / [fan.gpu_curve] the built-in BIOS table is used.
# When curves are saved from the desktop app, the service writes them at the
# end of this file and keeps everything else, including comments.

[protect]
# All fans to maximum when the CPU or GPU reaches this temperature (°C)
fans_max_at = 92.0
# At or above this temperature for drop_after_s seconds, leave Unleashed
# and run Balanced until it cools down
drop_at = 95.0
drop_after_s = 10
# Return to the selected mode after restore_after_s seconds below this temperature
restore_below = 80.0
restore_after_s = 30
# Fan check: measured speed below target x rpm_ratio for rpm_fail_after_s
# seconds counts as a fan fault (fans to maximum, Unleashed is left)
rpm_ratio = 0.7
rpm_fail_after_s = 10

[cpu]
# CPU energy/performance preference (intel_pstate EPP) while in Unleashed:
# keep, default, performance, balance_performance, balance_power or power.
# The 90/130 W power limits are the same either way; this only decides how
# eagerly the cores boost at light load. "performance" makes an idle desktop
# draw about 45 W and keeps the fans up; under full load both run the same.
# keep = leave it to power-profiles-daemon (it sets "performance").
unleashed_epp = "balance_performance"

