# DKMS build of the patched hp-wmi driver (see hpwmi-upstream/backport.patch).
# DKMS rebuilds it for every new kernel and, on Ubuntu, signs it with the
# machine's MOK key (/var/lib/shim-signed/mok/) so it loads with Secure Boot.
# The module lands in /lib/modules/<kernel>/updates/dkms/, which depmod prefers
# over the kernel's own hp-wmi.ko; removing this package brings the stock one back.
PACKAGE_NAME="omenctl-hp-wmi"
PACKAGE_VERSION="@VERSION@"
BUILT_MODULE_NAME[0]="hp-wmi"
DEST_MODULE_LOCATION[0]="/updates/dkms"
# Only tested against Linux 7.x; other kernels keep the stock driver.
BUILD_EXCLUSIVE_KERNEL="^7\."
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
AUTOINSTALL="yes"
