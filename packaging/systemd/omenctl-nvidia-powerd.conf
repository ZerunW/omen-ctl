<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  D-Bus policy for nvidia-powerd (NVIDIA Dynamic Boost).
  Ubuntu's nvidia-kernel-common-580 ships /usr/bin/nvidia-powerd but no policy.
  Conservative variant: only root may own the name and talk to it.
  Based on https://github.com/WangSteve123/omen_max_gpu_unlock (nvidia-powerd.conf),
  with the non-root "default" send rule removed.
-->
<busconfig>
  <policy user="root">
    <allow own="nvidia.powerd.server"/>
    <allow send_destination="nvidia.powerd.server"/>
  </policy>
</busconfig>
