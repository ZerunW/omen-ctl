[workspace]
resolver = "2"
members = ["omenctl-core", "omenctld", "omenctl-cli", "omenctl-gui"]

[workspace.package]
version = "0.2.8"
edition = "2021"
license = "GPL-2.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = 2
